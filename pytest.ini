[pytest]
testpaths =
    01-pipeline-documental-ia/tests
    02-biblioteca-web/tests
    03-averias-grafos-sql/tests
    04-integracion-sap/tests
    05-correos-masivos-graph/tests
    06-etl-indicadores-powerbi/tests
pythonpath =
    01-pipeline-documental-ia
    02-biblioteca-web
    03-averias-grafos-sql
    04-integracion-sap
    05-correos-masivos-graph
    06-etl-indicadores-powerbi
addopts = --import-mode=importlib -q
filterwarnings =
    ignore::DeprecationWarning:ezdxf.*
    ignore::DeprecationWarning:matplotlib.*
    ignore::DeprecationWarning:pyparsing.*
